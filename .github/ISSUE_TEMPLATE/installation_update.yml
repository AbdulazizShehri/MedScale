name: Install or update problem
description: MedScale will not install, start, update or uninstall
title: "[Install]: "
labels: ["installation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems with installing, first launch, updating or uninstalling.

        **Never include patient data, passphrases, recovery codes or vault files.** Do not turn off your operating system's security to get past a warning; tell us what it said instead.
  - type: input
    id: version
    attributes:
      label: MedScale version
      description: The version you tried to install or update to. Add the version you came from, if any.
      placeholder: "e.g., 0.1.0 (updating from the engineering preview)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "e.g., Windows 11 24H2 x64, or macOS 26.1 on Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - Windows installer (.exe) from a GitHub release
        - macOS disk image (.dmg) from a GitHub release
        - Build artifact from GitHub Actions
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options:
        - Download or checksum check
        - Operating system warning (SmartScreen, Gatekeeper)
        - During install
        - First launch
        - Update from an earlier version
        - Uninstall
        - Other
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: SHA-256 of the file you installed (optional)
      description: Helps us confirm you have the exact released file.
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include any warning or error text, word for word.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Download ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Only if they show no personal data, such as your user name in a file path.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no patient data, passphrases, recovery codes or vault files.
          required: true
