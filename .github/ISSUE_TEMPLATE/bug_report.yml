name: Bug report
description: Something in MedScale does not work as it should
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MedScale Beta.

        **Never include patient data, passphrases, recovery codes, vault files, keys or passwords.** Use fictional data only. Real patient data is not authorized in MedScale.

        Found a security problem? Do not open a public issue. Use [private security reporting](https://github.com/AbdulazizShehri/MedScale/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: MedScale version
      description: Shown in About. If you built from source, give the commit SHA.
      placeholder: "e.g., 0.1.0, or main at <commit>"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "e.g., Windows 11 24H2 x64, or macOS 26.1 on Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: How did you install MedScale?
      options:
        - Windows installer (.exe) from a GitHub release
        - macOS disk image (.dmg) from a GitHub release
        - Build artifact from GitHub Actions
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Desktop app
        - Encrypted vault, unlock or recovery
        - Audio and transcription
        - Models and packs
        - FHIR import
        - Install, update or uninstall
        - Command line (CLI)
        - Website
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening the app. Use the sample workspace or other fictional data.
      placeholder: |
        1. Open MedScale
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include any error message, word for word.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs (optional)
      description: Only add a screenshot or log if it shows no personal data. Check names, file paths and user names before you attach it.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no patient data, passphrases, recovery codes or vault files.
          required: true
