name: Accessibility problem
description: Something is hard or impossible to use with a screen reader, keyboard or other assistive technology
title: "[Accessibility]: "
labels: ["accessibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports from people who use assistive technology every day are some of the most useful we get.

        **Never include patient data, passphrases, recovery codes or vault files.** Use the sample workspace or other fictional data.
  - type: input
    id: version
    attributes:
      label: MedScale version
      description: Shown in About.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "e.g., Windows 11 24H2 x64, or macOS 26.1 on Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: assistive_tech
    attributes:
      label: Assistive technology
      options:
        - NVDA
        - JAWS
        - Windows Narrator
        - VoiceOver (macOS)
        - Keyboard only
        - Screen magnifier or zoom
        - High contrast or custom colours
        - Voice control or dictation
        - Other
    validations:
      required: true
  - type: input
    id: assistive_tech_version
    attributes:
      label: Assistive technology version
      placeholder: "e.g., NVDA 2026.3.0"
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen or place in the app
      placeholder: "e.g., Patients list, vault unlock, Settings"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What was announced or what happened?
      description: Quote the speech output word for word if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional)
      description: Keys pressed, in order, help a lot.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no patient data, passphrases, recovery codes or vault files.
          required: true
