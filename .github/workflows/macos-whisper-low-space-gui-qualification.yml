# CI-only no-download low-storage negative UI path on real macOS WKWebView.
# Never fills host disk, downloads models, records speech or modifies production.
name: macos-whisper-low-space-gui-qualification

on:
  pull_request:
    paths:
      - scripts/ci/macos-model-low-storage-instrument.py
      - scripts/ci/macos-webdriver-smoke.py
      - scripts/ci/macos-webdriver-instrument.py
      - .github/workflows/macos-whisper-low-space-gui-qualification.yml

permissions:
  contents: read

concurrency:
  group: macos-whisper-low-space-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-low-storage:
    name: macOS native zero-byte storage GUI refusal (no model download)
    runs-on: macos-latest
    timeout-minutes: 140
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: macos-whisper-low-space-gui-isolated
      - name: Instrument ephemeral checkout with native WebDriver and zero free space
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/macos-webdriver-instrument.py scripts/ci/macos-model-low-storage-instrument.py scripts/ci/macos-webdriver-smoke.py
          python3 scripts/ci/macos-webdriver-instrument.py
          python3 scripts/ci/macos-model-low-storage-instrument.py
          grep -q 'MEDSCALE_MAC_E2E_FORCE_LOW_STORAGE' apps/desktop-tauri/src-tauri/src/audio_model_manager.rs
          cd apps/desktop-tauri
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Build unsigned disposable macOS native WKWebView app
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles app --no-sign --ci --features custom-protocol,macos-webdriver-ci
      - name: Prove GUI denies download with consent, no worker or cache on zero free bytes
        timeout-minutes: 12
        env:
          MEDSCALE_MAC_E2E_FORCE_LOW_STORAGE: "1"
        run: python3 -u scripts/ci/macos-webdriver-smoke.py
      - name: Record bounded acceptance
        if: success()
        run: |
          echo 'Native macOS real WKWebView 0-byte simulated storage preflight and consented download denial: PASS; no model worker, cache or HTTP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Injected preflight free-byte metric in disposable CI checkout only. Not physical disk exhaustion, OS low-space alert, VoiceOver, user hardware or signed release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the synthetic path marker
        if: always()
        run: rm -f "$RUNNER_TEMP/medscale-low-storage-data-dir.txt"
