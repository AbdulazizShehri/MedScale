name: MedScale Website (Next.js)

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/website.yml"
      - "site/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/website.yml"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medscale-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build static Next.js site for project Pages path
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: /MedScale
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Verify static pages, brand assets and download honesty
        working-directory: web
        run: npm run check
      - name: Upload Pages artifact on protected main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Next.js static export
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
