# Experimental macOS WKWebView *real app* launch probe on disposable CI only.
# The earlier probe established System Events Accessibility is enabled; this
# does not use the Tauri mock runtime and downloads no model/recording.
# Deliberately diagnostic: it is NOT complete macOS UI/audio qualification.
name: macos-native-webview-window-probe
on:
  push:
    branches: ["diag/macos-gui-automation-probe-*"]
permissions:
  contents: read
concurrency:
  group: macos-real-webview-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-wkwebview:
    name: launch actual MedScale WKWebView and inspect native window
    runs-on: macos-latest
    timeout-minutes: 110
    env:
      RUSTFLAGS: -Dwarnings
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: macos-gui-probe
      - name: Frontend tests and app build
        working-directory: apps/desktop-tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Bundle unsigned native macOS app exclusively on CI
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles app --no-sign --ci --features custom-protocol -- --locked
      - name: Interact with real WKWebView sample and Audio through OS accessibility
        timeout-minutes: 4
        env:
          MEDSCALE_PROBE_CI_ONLY: "1"
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, time
          roots = [pathlib.Path("apps/desktop-tauri/src-tauri/target"),
                   pathlib.Path("target")]
          apps = [p for root in roots if root.exists()
                  for p in root.rglob("MedScale.app")
                  if "/bundle/macos/" in str(p)]
          if len(apps) != 1:
              raise SystemExit(f"Expected exactly one newly built MedScale.app; count={len(apps)}")
          executable = apps[0] / "Contents" / "MacOS" / "medscale-desktop-tauri"
          if not executable.is_file():
              raise SystemExit("Built app binary missing")
          process = subprocess.Popen([str(executable)], stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL)
          try:
              last = ""
              for attempt in range(35):
                  if process.poll() is not None:
                      raise SystemExit(f"Native app exited before UI check: code={process.returncode}")
                  script = ('tell application "System Events"\n'
                            f'  set candidates to every process whose unix id is {process.pid}\n'
                            '  if (count of candidates) is 0 then return "NO_PROCESS"\n'
                            '  set titles to name of every window of item 1 of candidates\n'
                            '  return titles as text\n'
                            'end tell')
                  query = subprocess.run(["osascript", "-e", script],
                      capture_output=True, text=True, timeout=18, check=False)
                  last = (query.stdout.strip() if query.returncode == 0 else query.stderr.strip())[:180]
                  if query.returncode == 0 and "MedScale" in last:
                      print("MAC_NATIVE_WKWEBVIEW_WINDOW_PASS window_title=MedScale renderer=native")
                      break
                  time.sleep(3)
              else:
                  raise SystemExit(f"Native MedScale window was not accessible: {last}")
              # Exercise production WKWebView accessibility (not MockRuntime)
              # with synthetic subjects only. No model, microphone or PHI.
              def ax(needle, press=False):
                  command = (
                      'tell application "System Events"\n'
                      f'  set candidates to every process whose unix id is {process.pid}\n'
                      '  if (count of candidates) is 0 then return "NO_PROCESS"\n'
                      '  set elements to entire contents of first window of item 1 of candidates\n'
                      '  repeat with el in elements\n'
                      '    try\n'
                      '      set elementName to name of el as text\n'
                      f'      if elementName contains "{needle}" then\n'
                      + ('        click el\n        return "PRESSED"\n' if press
                         else '        return "FOUND"\n')
                      + '      end if\n'
                      '    end try\n'
                      '  end repeat\n'
                      '  return "NOT_FOUND"\n'
                      'end tell'
                  )
                  out = subprocess.run(["osascript", "-e", command],
                      capture_output=True, text=True, timeout=40, check=False)
                  return out.returncode, out.stdout.strip(), out.stderr.strip()[:160]
              for _ in range(10):
                  result = ax("Try MedScale with sample data", press=True)
                  if result[:2] == (0, "PRESSED"):
                      print("MAC_NATIVE_WKWEBVIEW_SAMPLE_CLICK_PASS")
                      break
                  time.sleep(2)
              else:
                  raise SystemExit(f"Native welcome action inaccessible: {result}")
              # Audio is ProjectScope in production: without an active
              # project it deliberately shows "Create a project", not Audio.
              # Provision one via WKWebView's real accessible controls.
              for _ in range(15):
                  result = ax("Audio", press=True)
                  if result[:2] == (0, "PRESSED"):
                      print("MAC_NATIVE_WKWEBVIEW_AUDIO_NAV_ACTION")
                      break
                  time.sleep(2)
              else:
                  raise SystemExit(f"Native Audio navigation inaccessible: {result}")
              # Query-only probe first, to avoid confusing a successful
              # accessibility 'click' call with an actual route transition.
              for _ in range(10):
                  result = ax("Create a project")
                  if result[:2] == (0, "FOUND"):
                      print("MAC_NATIVE_WKWEBVIEW_PROJECT_REQUIRED_CONFIRMED")
                      break
                  if ax("Import synthetic tone sample")[:2] == (0, "FOUND"):
                      print("MAC_NATIVE_WKWEBVIEW_AUDIO_CONTROLS_PASS")
                      result = None
                      break
                  time.sleep(2)
              if result is not None:
                  if result[:2] != (0, "FOUND"):
                      raise SystemExit(f"No project gate or Audio controls after route navigation: {result}")
                  if ax("Create a project", press=True)[:2] != (0, "PRESSED"):
                      raise SystemExit("Could not open the project creation form")
                  # WebKit's AX API returns name-of-element but not role-of-element
                  # for this runner. Target the real associated HTML label Name
                  # (or its input placeholder), then type using OS key events.
                  # Assert actual project creation and Audio afterward.
                  fill = (
                      'tell application "System Events"\n'
                      f'  set candidates to every process whose unix id is {process.pid}\n'
                      '  set frontmost of item 1 of candidates to true\n'
                      '  set fields to every UI element of first window of item 1 of candidates\n'
                      '  repeat with el in (entire contents of first window of item 1 of candidates)\n'
                      '    try\n'
                      '      set elementName to name of el as text\n'
                      '      if elementName is "Name" or elementName contains "e.g. Coverage audit" then\n'
                      '        click el\n'
                      '        keystroke "MedScale synthetic macOS QA"\n'
                      '        return "NAME_ENTERED"\n'
                      '      end if\n'
                      '    end try\n'
                      '  end repeat\n'
                      '  return "NO_TEXT_FIELD"\n'
                      'end tell'
                  )
                  # Native WebKit's AX subtree can take several seconds to
                  # materialize after clicking navigation. Query repeatedly;
                  # do not report route success from a mere 'click' return.
                  for _ in range(15):
                      typed = subprocess.run(["osascript", "-e", fill],
                          capture_output=True, text=True, timeout=45, check=False)
                      if (typed.returncode, typed.stdout.strip()) == (0, "NAME_ENTERED"):
                          print("MAC_NATIVE_WKWEBVIEW_PROJECT_NAME_TYPED")
                          break
                      time.sleep(2)
                  else:
                      # Only log bounded accessibility role counts and two
                      # fixed UI-label checks; never names/values or screenshots.
                      diag = (
                          'tell application "System Events"\n'
                          f'  set candidates to every process whose unix id is {process.pid}\n'
                          '  set roleNames to {}\n'
                          '  repeat with el in (entire contents of first window of item 1 of candidates)\n'
                          '    try\n'
                          '      set end of roleNames to (role of el as text)\n'
                          '    end try\n'
                          '  end repeat\n'
                          '  return roleNames as text\n'
                          'end tell'
                      )
                      snapshot = subprocess.run(["osascript", "-e", diag],
                          capture_output=True, text=True, timeout=40, check=False)
                      role_text = snapshot.stdout.lower()
                      print(f"MAC_AX_ROLE_DIAG total_characters={len(role_text)} "
                            f"text_field={role_text.count('textfield')} "
                            f"button={role_text.count('button')} "
                            f"create_control={ax('Create project')[1]} "
                            f"name_label={ax('Name')[1]}")
                      raise SystemExit(f"Native project Name label not usable via AX after bounded retries: status={typed.returncode} result={typed.stdout.strip()[:40]}")
                  created = False
                  for _ in range(12):
                      result = ax("Create project", press=True)
                      if result[:2] == (0, "PRESSED"):
                          print("MAC_NATIVE_WKWEBVIEW_PROJECT_CREATE_ACTION")
                          created = True
                          break
                      time.sleep(2)
                  if not created:
                      raise SystemExit(f"Project create control inaccessible: {result}")
                  # Navigation must happen only after the project exists.
                  for _ in range(15):
                      result = ax("Audio", press=True)
                      if result[:2] == (0, "PRESSED"):
                          break
                      time.sleep(2)
                  else:
                      raise SystemExit(f"Audio navigation missing after project creation: {result}")
                  for _ in range(15):
                      result = ax("Import synthetic tone sample")
                      if result[:2] == (0, "FOUND"):
                          print("MAC_NATIVE_WKWEBVIEW_AUDIO_CONTROLS_PASS")
                          break
                      time.sleep(2)
                  else:
                      raise SystemExit(f"Audio controls missing after project creation: {result}")
          finally:
              process.terminate()
              try: process.wait(timeout=12)
              except subprocess.TimeoutExpired: process.kill()
          PY
      - name: Record narrow claim only
        if: success()
        run: |
          echo "Native macOS WKWebView sample, synthetic project creation, and Audio controls: PASS. The full real-human macOS GUI transcription journey remains unqualified." >> "$GITHUB_STEP_SUMMARY"