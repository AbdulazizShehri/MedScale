# Issue #314 follow-up: true macOS WKWebView + real publicly licensed voice + real Whisper.
# CI-only HTTP control, no founder-device changes. No public media/model artifacts.
name: macos-real-human-wkwebview-qualification
on:
  push:
    branches: ["diag/macos-gui-real-human-whisper-*"]
permissions:
  contents: read
concurrency:
  group: macos-real-human-wkwebview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gui-human-whisper:
    name: macOS bundled GUI real LibriSpeech -> Whisper -> visible transcript
    runs-on: macos-latest
    timeout-minutes: 140
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: macos-gui-real-human-whisper-isolated
      - name: Prepare only test-specific WebDriver instrumentation and frontend
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/macos-webdriver-instrument.py scripts/ci/macos-webdriver-smoke.py
          python3 scripts/ci/macos-webdriver-instrument.py
          cd apps/desktop-tauri
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Ensure pinned public voice decoder on ephemeral macOS runner
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -version | head -1
      - name: Authenticate CC-BY-4.0 original LibriSpeech test-clean archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/test-clean.tar.gz"
          curl -fsSL --retry 3 --max-time 480 \
            https://www.openslr.org/resources/12/test-clean.tar.gz -o "$archive"
          [ "$(stat -f '%z' "$archive")" = "346663984" ]
          [ "$(md5 -q "$archive")" = "32fa31d27d2e1cad72775fee3f4849a9" ]
          wav="$RUNNER_TEMP/real-human-voice.wav"
          python3 scripts/qualification/prepare_librispeech_one_wav.py "$archive" "$wav"
          test -s "$wav"
          echo "MEDSCALE_E2E_REAL_WAV_PATH=$wav" >> "$GITHUB_ENV"
          echo "REAL_VOICE_WAV_PREPARED source=LibriSpeech-test-clean license=CC-BY-4.0 clips=1"
      - name: Prepare immutable, digest-verified local Whisper tiny-en Audio Pack
        run: |
          set -euo pipefail
          snap="$RUNNER_TEMP/pinned-whisper-snapshot"
          pack="$RUNNER_TEMP/pinned-whisper-pack"
          mkdir -p "$snap"
          rev=87c7102498dcde7456f24cfd30239ca606ed9063
          curl -fsSL --retry 3 --max-time 240 \
            "https://huggingface.co/api/models/openai/whisper-tiny.en/revision/$rev?blobs=true" \
            -o "$snap/metadata.json"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m.get("id") == "openai/whisper-tiny.en" and m.get("sha") == sys.argv[2]' "$snap/metadata.json" "$rev"
          for f in config.json tokenizer.json model.safetensors; do
            curl -fsSL --retry 3 --max-time 600 \
              "https://huggingface.co/openai/whisper-tiny.en/resolve/$rev/$f" -o "$snap/$f"
          done
          cargo run --release --locked -p medscale-pack \
            --example prepare_asr_e2e_pack -- "$snap" "$pack"
          test -d "$pack"
          echo "MEDSCALE_E2E_REAL_ASR_PACK_PATH=$pack" >> "$GITHUB_ENV"
          echo "MAC_REAL_WHISPER_PACK_READY pinned_revision=$rev"
      - name: Bundle true native app with CI-only localhost WebDriver enabled
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles app --no-sign --ci --features custom-protocol,macos-webdriver-ci
      - name: Real macOS WKWebView import, model admission and nonfixture transcript
        timeout-minutes: 8
        run: python3 -u scripts/ci/macos-webdriver-smoke.py
      - name: Strict source-bound evidence
        if: success()
        run: |
          echo "Native macOS WKWebView user journey: real pinned LibriSpeech human WAV + genuine, source-bound Whisper tiny-en Pack + visible nonfixture local transcript: PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "This is one bounded English public-read-speech journey, not general-language WER, medical accuracy, Apple code-signing or end-user upgrade qualification." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove public audio, model checkpoint, archive and temp Pack
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/test-clean.tar.gz" \
            "$RUNNER_TEMP/real-human-voice.wav" \
            "$RUNNER_TEMP/pinned-whisper-snapshot" \
            "$RUNNER_TEMP/pinned-whisper-pack"
