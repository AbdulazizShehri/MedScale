# Clean install, launch, upgrade and uninstall of this branch's Windows installer on
# disposable runners. Never publishes anything. The installer is unsigned, is kept for
# one day only so the test jobs can use it, and passing here qualifies no release.
name: release-windows-lifecycle

on:
  push:
    branches:
      - "test/release-windows-lifecycle-*"

permissions:
  contents: read

env:
  # The published engineering preview an upgrade starts from.
  PREVIOUS_TAG: "engineering-preview-19d419dd7b15"
  PREVIOUS_ASSET: "MedScale-engineering-preview-windows-x64.exe"

jobs:
  build:
    name: Build the unsigned test installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
      - name: Install locked frontend without lifecycle scripts
        working-directory: apps/desktop-tauri
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle the unsigned installer
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles nsis --no-sign --ci --features custom-protocol -- --locked
      - name: Collect the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @(Get-ChildItem -Path target, apps/desktop-tauri/src-tauri/target -Recurse -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue | Where-Object FullName -match '\\bundle\\nsis\\')
          if ($found.Count -ne 1) { throw "Expected one installer, found $($found.Count)" }
          New-Item -ItemType Directory -Path lifecycle-installer -Force | Out-Null
          Copy-Item -LiteralPath $found[0].FullName -Destination lifecycle-installer/MedScale-lifecycle-test-UNSIGNED-setup.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: lifecycle-test-installer-unsigned-not-a-release
          path: lifecycle-installer/
          if-no-files-found: error
          retention-days: 1

  clean:
    name: Clean install, launch and uninstall (Windows x64)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Retrieve the test installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name lifecycle-test-installer-unsigned-not-a-release --dir lifecycle-installer
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the installer' }
      - name: Run the clean lifecycle
        shell: pwsh
        run: node scripts/e2e/windows-lifecycle.mjs clean "$PWD/lifecycle-installer/MedScale-lifecycle-test-UNSIGNED-setup.exe" target/windows-lifecycle/clean.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: windows-lifecycle-clean
          path: target/windows-lifecycle/
          if-no-files-found: warn
          retention-days: 30

  upgrade:
    name: Upgrade from the published preview (Windows x64)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Retrieve both installers and verify the published one
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name lifecycle-test-installer-unsigned-not-a-release --dir lifecycle-installer
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the installer' }
          gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:PREVIOUS_ASSET --pattern SHA256SUMS --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the published preview' }
          $expected = (Select-String -LiteralPath previous/SHA256SUMS -SimpleMatch $env:PREVIOUS_ASSET).Line.Split(' ')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath "previous/$env:PREVIOUS_ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected) { throw 'The published preview does not match its checksum' }
      - name: Run the upgrade lifecycle
        shell: pwsh
        run: node scripts/e2e/windows-lifecycle.mjs upgrade "$PWD/lifecycle-installer/MedScale-lifecycle-test-UNSIGNED-setup.exe" target/windows-lifecycle/upgrade.json "$PWD/previous/$env:PREVIOUS_ASSET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: windows-lifecycle-upgrade
          path: target/windows-lifecycle/
          if-no-files-found: warn
          retention-days: 30
