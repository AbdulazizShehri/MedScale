name: tauri-preview

on:
  # Main is verified after every merge too: ci.yml does not build the desktop.
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/desktop-tauri/**
      # Native GUI journey changes require fresh Windows/macOS desktop qualification.
      - scripts/e2e/desktop-journey.mjs
      - scripts/package-tauri-preview.ps1
      - scripts/package-tauri-release.ps1
      - scripts/verify-tauri-release.ps1
      - scripts/test-verify-tauri-release.ps1
      - scripts/qualify-tauri-installer-windows.ps1
      - scripts/qualify-tauri-package-macos.ps1
      - scripts/qualify-tauri-package-linux.ps1
      - specs/101-tauri-release-packaging/**
      - assets/brand/**
      - crates/medscale-desktop/ui/assets/**
      - deny.toml
      - scripts/ci/tauri_deny_config.py
      - vendor/**
      - crates/**
      - Cargo.lock
      - .github/workflows/tauri-preview.yml
      - .github/workflows/ci.yml
      - specs/096-tauri-foundation/**
      - evidence/096-tauri-foundation/**
      - docs/engineering/admissions/096-tauri-presentation.md

permissions:
  contents: read

concurrency:
  group: tauri-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Dwarnings
  CARGO_BUILD_JOBS: "2"

jobs:
  native:
    name: tauri preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The release build and packaging take about 50 minutes on windows-latest;
    # run 39197130805 hit the old 60-minute limit while saving the cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Shipped desktop platforms only. A Linux desktop waits on an upstream
        # Tauri move off GTK 3 / glib 0.18 (EXTERNAL_GATES.md,
        # TAURI_GLIB_ADVISORY_F096_T01); the Linux CLI and Core are covered by ci.yml.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
      - name: Install locked frontend without lifecycle scripts
        working-directory: apps/desktop-tauri
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend tests and build
        working-directory: apps/desktop-tauri
        run: |
          npm test
          npm run build
      - name: Rust format
        run: cargo fmt --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml -- --check
      - name: Rust Clippy and tests
        run: |
          cargo clippy --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --features custom-protocol --all-targets --locked -- -D warnings
          cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --features custom-protocol --locked
      - name: Build native preview
        run: cargo build --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --features custom-protocol --release --locked
      - name: Package unqualified preview with sources and notices
        shell: pwsh
        run: ./scripts/package-tauri-preview.ps1
      - name: Bundle unsigned engineering installer (Spec 101)
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            macOS) bundles=app,dmg ;;
          esac
          npm run tauri -- build --bundles "$bundles" --no-sign --ci --features custom-protocol -- --locked
      - name: Record build-time tool hashes (Spec 101 FR-003)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri' 'NSIS'
          Get-ChildItem -LiteralPath $tools -Recurse -File | Where-Object { $_.Name -in 'makensis.exe','nsis_tauri_utils.dll' } |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.FullName.Substring($tools.Length + 1) }
      - name: Assemble and verify release set (Spec 101 T101-04/05)
        shell: pwsh
        run: |
          ./scripts/package-tauri-release.ps1
          $platform = if ($IsWindows) { 'windows' } else { 'macos' }
          ./scripts/verify-tauri-release.ps1 -Root "target/tauri-release/$platform" -ExpectedSourceSha '${{ github.event.pull_request.head.sha || github.sha }}'
          ./scripts/test-verify-tauri-release.ps1
      - name: Install, launch and uninstall qualification (Spec 101 T101-07)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/qualify-tauri-installer-windows.ps1 -ReleaseRoot target/tauri-release/windows -ReportPath target/tauri-release-qualification/windows.json
      - name: Package launch and removal qualification (Spec 101 T101-08)
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/qualify-tauri-package-macos.ps1 -ReleaseRoot target/tauri-release/macos -ReportPath target/tauri-release-qualification/macos.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: tauri-installer-${{ matrix.os }}
          path: |
            target/tauri-release/
            target/tauri-release-qualification/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: tauri-preview-${{ matrix.os }}
          path: target/tauri-preview-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  policy:
    name: tauri dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
      - name: Scope the repository policy to the shipped desktop targets
        # Same advisories, licenses, bans and sources as deny.toml; only the
        # graph is limited to Windows and macOS. No advisory is ignored.
        run: python3 scripts/ci/tauri_deny_config.py deny.toml deny-tauri.toml
      - name: Shipped desktop graphs contain no GTK or glib crate
        run: |
          set -euo pipefail
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin; do
            found=$(cargo tree -q --locked --all-features --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml               --target "$target" -e normal,build --prefix none               | grep -E '^(glib|gtk|gdk|gio|webkit2gtk|javascriptcore-rs|soup3)[a-z0-9-]* ' || true)
            if [ -n "$found" ]; then echo "::error::$target graph contains: $found"; exit 1; fi
            echo "$target: no GTK/glib crates"
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: apps/desktop-tauri/src-tauri/Cargo.toml
          arguments: --config deny-tauri.toml --locked --features custom-protocol
