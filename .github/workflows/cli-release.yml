name: cli-release

# R8: unsigned engineering archives of the `medscale` CLI for Windows, macOS
# (Apple Silicon and Intel) and Linux. Builds, tests the binary, packages it
# with licenses, notices and an SBOM, then installs it from the archive on the
# same runner and smoke-tests it. Artifacts only: nothing is published,
# released or signed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - scripts/package-cli-release.ps1
      - scripts/generate-release-sbom.ps1
      - .github/workflows/cli-release.yml
  pull_request:
    paths:
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - scripts/package-cli-release.ps1
      - scripts/generate-release-sbom.ps1
      - .github/workflows/cli-release.yml

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Dwarnings
  CARGO_BUILD_JOBS: "2"

jobs:
  cli:
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: the binary needs glibc 2.35 or newer.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, native: true }
          # crt-static: no Visual C++ runtime needed on the user's PC.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true, rustflags: "-Dwarnings -Ctarget-feature=+crt-static" }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          # Intel Mac: cross-built on Apple Silicon, run under Rosetta 2.
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '-Dwarnings' }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p medscale-cli --target ${{ matrix.target }}
      - name: Binary tests (exit codes, JSON, encrypted vault, backup and restore)
        if: matrix.native
        run: cargo test --release --locked -p medscale-cli --target ${{ matrix.target }} --test binary
      - name: Package archive with licenses, notices and SBOM
        shell: pwsh
        run: ./scripts/package-cli-release.ps1 -Target ${{ matrix.target }}
      - name: Install from the archive and smoke-test it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Resolve-Path target/cli-release
          $archive = Get-ChildItem $out -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | Select-Object -First 1
          $expected = (Get-Content (Join-Path $out 'SHA256SUMS-${{ matrix.target }}')).Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'archive hash differs' }
          $install = Join-Path ([IO.Path]::GetTempPath()) "medscale-cli-install-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $install | Out-Null
          if ($archive.Name -like '*.zip') { Expand-Archive $archive.FullName -DestinationPath $install } else { tar -xzf $archive.FullName -C $install }
          $dir = Get-ChildItem $install -Directory | Select-Object -First 1
          foreach ($line in Get-Content (Join-Path $dir.FullName 'SHA256SUMS')) {
            $hash, $rel = $line -split '  ', 2
            if ((Get-FileHash (Join-Path $dir.FullName $rel) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw "file hash differs: $rel" }
          }
          $exe = Join-Path $dir.FullName $(if ($IsWindows) { 'medscale.exe' } else { 'medscale' })
          # A clean PATH: the archive must not need the Rust toolchain.
          $env:PATH = if ($IsWindows) { "$env:SystemRoot\System32;$env:SystemRoot" } else { '/usr/bin:/bin' }
          if ('${{ matrix.target }}' -eq 'x86_64-apple-darwin') {
            & /usr/bin/arch -x86_64 $exe --version; if ($LASTEXITCODE) { throw 'Intel binary did not run under Rosetta 2' }
            $status = & /usr/bin/arch -x86_64 $exe status --json
          } else {
            & $exe --version; if ($LASTEXITCODE) { throw '--version failed' }
            $status = & $exe status --json
          }
          if ($LASTEXITCODE) { throw 'status failed' }
          $s = $status | Out-String | ConvertFrom-Json
          if ($s.real_phi_authorized -ne $false -or $s.release_ready -ne $false) { throw 'status flags changed' }
          if ($IsLinux) { & ldd $exe }
          if ($IsMacOS) { & otool -L $exe }
          "installed and ran from $($archive.Name)"
      - name: Linked runtime libraries are system ones only
        shell: bash
        run: |
          set -euo pipefail
          exe=target/${{ matrix.target }}/release/medscale
          case "$RUNNER_OS" in
            Linux)
              bad=$(ldd "$exe" | grep -vE 'linux-vdso|ld-linux|libc\.so|libm\.so|libpthread|libdl|libgcc_s|librt' || true) ;;
            macOS)
              bad=$(otool -L "$exe" | tail -n +2 | grep -vE '/usr/lib/|/System/Library/' || true) ;;
            Windows)
              # The import table names each DLL in ASCII; crt-static leaves no C runtime DLL.
              bad=$(grep -a -o -i -E '(vcruntime[0-9_]*|msvcp[0-9_]*|ucrtbase|api-ms-win-crt-[a-z0-9-]*)\.dll' "$exe.exe" | sort -u || true) ;;
          esac
          if [ -n "$bad" ]; then echo "::error::non-system runtime dependency: $bad"; exit 1; fi
          echo "system libraries only"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: medscale-cli-${{ matrix.target }}
          path: |
            target/cli-release/*.zip
            target/cli-release/*.tar.gz
            target/cli-release/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
