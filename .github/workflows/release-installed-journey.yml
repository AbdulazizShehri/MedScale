# Qualifies the exact installer from a pinned tauri-preview run, as a visitor would
# use it: never rebuilds, never publishes, and uses only lawful public speech and
# synthetic data on a disposable runner.
name: release-installed-journey

on:
  push:
    branches:
      - "test/release-installed-journey-*"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN: "42339761396"
  SOURCE_SHA: "5be03be5c7e03bac8b73ae40a9bdedffcb33f1db"

jobs:
  windows:
    name: Installed journey (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Retrieve the source-bound installer and verify its release set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/AbdulazizShehri/MedScale/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.head_sha -ne $env:SOURCE_SHA -or $run.conclusion -ne 'success') { throw 'Source run is not qualified' }
          gh run download $env:SOURCE_RUN --repo AbdulazizShehri/MedScale --name tauri-installer-windows-latest --dir target/release-archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the installer' }
          $manifest = @(Get-ChildItem -LiteralPath target/release-archive -Filter package-manifest.json -Recurse -File)
          if ($manifest.Count -ne 1) { throw 'Expected one release manifest' }
          $root = $manifest[0].Directory.FullName
          ./scripts/verify-tauri-release.ps1 -Root $root -ExpectedSourceSha $env:SOURCE_SHA
          $installer = @(Get-ChildItem -LiteralPath (Join-Path $root 'installer') -Filter '*-setup.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          "RELEASE_INSTALLER=$($installer[0].FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "RELEASE_MANIFEST=$($manifest[0].FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Acquire public speech and verify its source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps imageio-ffmpeg==0.6.0
          $wheelExe = (python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())').Trim()
          $ffmpegDir = Join-Path $env:RUNNER_TEMP 'medscale-ffmpeg'
          New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
          Copy-Item -LiteralPath $wheelExe -Destination (Join-Path $ffmpegDir 'ffmpeg.exe') -Force
          $env:PATH = "$ffmpegDir;$env:PATH"
          $archive = Join-Path $env:RUNNER_TEMP 'test-clean.tar.gz'
          curl.exe -fLsS --retry 3 --max-time 480 'https://www.openslr.org/resources/12/test-clean.tar.gz' -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Speech download failed' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm MD5).Hash.ToLowerInvariant()
          if ($hash -ne '32fa31d27d2e1cad72775fee3f4849a9' -or (Get-Item $archive).Length -ne 346663984) { throw 'Unverified archive refused' }
          $wav = Join-Path $env:RUNNER_TEMP 'real-human-voice.wav'
          $reference = Join-Path $env:RUNNER_TEMP 'real-human-voice.txt'
          python scripts/qualification/prepare_librispeech_one_wav.py $archive $wav $reference
          if ($LASTEXITCODE -ne 0) { throw 'No public speech example' }
          "MEDSCALE_E2E_REAL_WAV_PATH=$wav" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "MEDSCALE_E2E_REAL_WAV_REFERENCE=$reference" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Run the journey on the installed release build
        shell: pwsh
        run: node scripts/e2e/installed-journey.mjs $env:RELEASE_INSTALLER $env:RELEASE_MANIFEST target/installed-journey/windows.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: installed-journey-windows
          path: target/installed-journey/
          if-no-files-found: warn
          retention-days: 30

  macos:
    name: Install from the real DMG (macOS Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Retrieve the source-bound DMG and verify its release set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/AbdulazizShehri/MedScale/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.head_sha -ne $env:SOURCE_SHA -or $run.conclusion -ne 'success') { throw 'Source run is not qualified' }
          gh run download $env:SOURCE_RUN --repo AbdulazizShehri/MedScale --name tauri-installer-macos-latest --dir target/release-archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the DMG' }
          $manifest = @(Get-ChildItem -LiteralPath target/release-archive -Filter package-manifest.json -Recurse -File)
          if ($manifest.Count -ne 1) { throw 'Expected one release manifest' }
          $root = $manifest[0].Directory.FullName
          ./scripts/verify-tauri-release.ps1 -Root $root -ExpectedSourceSha $env:SOURCE_SHA
          $dmg = @(Get-ChildItem -LiteralPath (Join-Path $root 'installer') -Filter '*.dmg' -File)
          if ($dmg.Count -ne 1) { throw 'Expected one DMG' }
          "RELEASE_DMG=$($dmg[0].FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Install from the DMG, record Gatekeeper, launch and remove
        run: bash scripts/e2e/installed-dmg-macos.sh "$RELEASE_DMG" target/installed-journey/macos.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: installed-journey-macos
          path: target/installed-journey/
          if-no-files-found: warn
          retention-days: 30
