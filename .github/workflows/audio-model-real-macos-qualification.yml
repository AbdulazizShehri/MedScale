# Isolated macOS ARM64/Intel platform qualification of the real pinned
# Whisper acquisition path. Public model only; no user audio or PHI.
# Runs only on explicit qual-audio-macos/** pushes, not on PRs or main.
name: audio-model-real-macos-qualification

on:
  push:
    branches: ["qual-audio-macos/**"]

permissions:
  contents: read

concurrency:
  group: audio-model-real-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-real-whisper-macos:
    name: pinned Whisper ${{ matrix.language }} source verification (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - model_id: whisper-tiny-en
            language: English
          - model_id: whisper-tiny-multilingual
            language: multilingual-en-ar
          - model_id: whisper-base-multilingual
            language: multilingual-base-en-ar
          - model_id: whisper-small-multilingual
            language: multilingual-small-en-ar
    env:
      MEDSCALE_QUAL_MODEL_ID: ${{ matrix.model_id }}
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Dwarnings"
      MEDSCALE_QUAL_REAL_MODEL: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: real-whisper-macos-${{ matrix.model_id }}-qualification
      - name: Build desktop frontend without lifecycle scripts
        working-directory: apps/desktop-tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify Rust format
        run: cargo fmt --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml -- --check
      - name: Download and hash-check real pinned Whisper with production code
        run: |
          # The ignored test creates/deletes its app-owned temporary model
          # stage. No checkpoint, human audio or artifact is uploaded.
          cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --locked --features custom-protocol verified_real_tiny_en_download_creates_admissible_pack -- --ignored --nocapture --test-threads=1
      - name: Summarize evidence without publishing weights
        if: success()
        run: |
          echo "QUALIFIED: macOS public pinned Whisper ${{ matrix.model_id }} HTTPS download, immutable revision, model provenance, byte bounds, digest verification and signed Audio Pack creation. Speech recognition quality and human voice transcription are NOT qualified by this test." >> "$GITHUB_STEP_SUMMARY"
