# Production-path qualification of an actual open Whisper checkpoint, exclusively
# on a disposable free GitHub-hosted runner. Never runs on PRs or on main.
# No private audio/PHI or model files are stored as Actions artifacts.
name: audio-model-real-qualification

on:
  push:
    branches: ["qual-audio-model/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-model-real-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-real-whisper:
    name: pinned English Whisper download, verify, signed Pack (Windows)
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      CARGO_BUILD_JOBS: "2"
      MEDSCALE_QUAL_REAL_MODEL: "1"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: audio-model-real-qualification
      - name: Build native frontend
        working-directory: apps/desktop-tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify format before compiling
        run: cargo fmt --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml -- --check
      - name: Download and verify genuine pinned Whisper model
        shell: pwsh
        run: |
          # This ignored test is the only code permitted to make a real
          # model HTTP request. Test helper cleans its isolated temp folder.
          cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --locked --features custom-protocol verified_real_tiny_en_download_creates_admissible_pack -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Pinned Whisper acquisition qualification failed" }
      - name: Public, non-sensitive result
        if: success()
        shell: pwsh
        run: |
          "QUALIFIED: pinned whisper-tiny.en metadata, bounded HTTPS transfer, digest checks, signed local Pack assembly, and temporary cleanup on an isolated Windows runner." >> $env:GITHUB_STEP_SUMMARY
