# Spec 103: real-model execution qualification on zero-cost GitHub runners.
#
# Each job acquires ONE pinned OpenMed v3.0.0 catalog model (Hub metadata plus
# config.json, tokenizer.json and one ONNX file at the metadata's commit), then
# runs the ignored external test, which verifies the snapshot against the
# catalog (reproducibility hash, per-file size and digest) before building a
# signed Pack, admitting it and executing it locally. Sample text is synthetic.
# Weights are never committed or uploaded; only the test log is kept.
#
# Runs only on demand or on `qual/**` branches, never on PRs or main.
name: model-qualification

on:
  workflow_dispatch:
  push:
    branches: ["qual/**"]

permissions:
  contents: read

concurrency:
  group: model-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CATALOG_COMMIT: ea920f36fadd7b45935247d639f0ffa1ef493b23

jobs:
  qualify:
    name: qualify (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - arch: qwen-int8-dutch
            repo: OpenMed/OpenMed-PII-Dutch-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "Patiënt Jan de Vries, geboren op 12 maart 1980, woont in Utrecht."
          - arch: qwen-int8-french
            repo: OpenMed/OpenMed-PII-French-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "Le patient Jean Dupont, né le 12 mars 1980, habite à Lyon."
          - arch: qwen-int8-german
            repo: OpenMed/OpenMed-PII-German-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "Der Patient Hans Müller, geboren am 12. März 1980, wohnt in Berlin."
          - arch: qwen-int8-hindi
            repo: OpenMed/OpenMed-PII-Hindi-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "मरीज़ राहुल शर्मा का जन्म 12 मार्च 1980 को हुआ और वह दिल्ली में रहते हैं।"
          - arch: qwen-int8-italian
            repo: OpenMed/OpenMed-PII-Italian-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "Il paziente Mario Rossi, nato il 12 marzo 1980, vive a Milano."
          - arch: qwen-int8-japanese
            repo: OpenMed/OpenMed-PII-Japanese-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "患者の山田太郎さんは1980年3月12日生まれで、東京に住んでいます。"
          - arch: qwen-int8-korean
            repo: OpenMed/OpenMed-PII-Korean-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "환자 김민수는 1980년 3월 12일에 태어났으며 서울에 살고 있습니다."
          - arch: qwen-int8-portuguese
            repo: OpenMed/OpenMed-PII-Portuguese-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "O paciente João Silva, nascido em 12 de março de 1980, mora em Lisboa."
          - arch: qwen-int8-english
            repo: OpenMed/OpenMed-PII-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "Patient John Smith, born 12 March 1980, lives in Leeds."
          - arch: qwen-int8-spanish
            repo: OpenMed/OpenMed-PII-Spanish-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "La paciente María García, nacida el 3 de mayo de 1975, vive en Sevilla."
          - arch: qwen-int8-telugu
            repo: OpenMed/OpenMed-PII-Telugu-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "రోగి రవి కుమార్ 1980 మార్చి 12న జన్మించారు మరియు హైదరాబాద్‌లో నివసిస్తున్నారు."
          - arch: qwen-int8-turkish
            repo: OpenMed/OpenMed-PII-Turkish-QwenMed-XLarge-600M-v1-onnx-android
            onnx: model_int8.onnx
            test: openmed_snapshot_external_103
            text: "Hasta Ahmet Yılmaz, 12 Mart 1980 doğumlu ve İstanbul'da yaşıyor."
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned master
        with:
          toolchain: "1.97.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: model-qualification

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Acquire through the product CLI (catalog-pinned revision)
        env:
          REPO: ${{ matrix.repo }}
          ONNX: ${{ matrix.onnx }}
        run: |
          set -euo pipefail
          curl -sfL -A medscale-qualification             "https://raw.githubusercontent.com/maziyarpanahi/openmed/$CATALOG_COMMIT/models.jsonl"             -o "$RUNNER_TEMP/models.jsonl"
          cargo build --release --locked -p medscale-cli
          dir="$RUNNER_TEMP/snapshot"
          target/release/medscale packs acquire --snapshot "$RUNNER_TEMP/models.jsonl"             --commit "$CATALOG_COMMIT" --repo-id "$REPO" --onnx-file "$ONNX"             --approve-bytes 1100000000 --i-consent-to-download --out "$dir"
          ls -l "$dir"
          echo "SNAPSHOT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Verify, admit and execute
        env:
          MEDSCALE_CATALOG_SNAPSHOT: ${{ runner.temp }}/models.jsonl
          MEDSCALE_CATALOG_COMMIT: ${{ env.CATALOG_COMMIT }}
          MEDSCALE_HF_ONNX_FILE: ${{ matrix.onnx }}
          MEDSCALE_SAMPLE_TEXT: ${{ matrix.text }}
          MEDSCALE_PLAN_CACHE: "1"
        run: |
          set -o pipefail
          export MEDSCALE_HF_SNAPSHOT_DIR="$SNAPSHOT_DIR"
          cargo test --release --locked -p medscale-pack --test "${{ matrix.test }}" \
            -- --ignored --nocapture 2>&1 | tee qualification.log
          grep -E '^(SNAPSHOT_|PLAN_CACHE_)' qualification.log >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log (no weights)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: qualification-${{ matrix.arch }}
          path: qualification.log
          if-no-files-found: ignore

  # Live governed acquisition (Spec 103 T103-08): the product CLI downloads a
  # catalog row through the Governed Browse transport (explicit consent, byte
  # ceiling, Hub host allowlist, pinned-commit digests, atomic staging), then
  # the external tests verify, admit and execute exactly what it acquired.
  live-acquisition:
    name: live acquisition (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: safetensors
            repo: OpenMed/OpenMed-NER-AnatomyDetect-ElectraMed-33M
            file: model.safetensors
            approve: "80000000"
            test: safetensors_external_104
          - kind: onnx
            repo: OpenMed/OpenMed-NER-DiseaseDetect-ElectraMed-33M-v1-onnx-android
            file: model.onnx
            approve: "140000000"
            test: openmed_snapshot_external_103
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned master
        with:
          toolchain: "1.97.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: model-qualification-live

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Catalog snapshot
        run: |
          curl -sfL -A medscale-qualification \
            "https://raw.githubusercontent.com/maziyarpanahi/openmed/$CATALOG_COMMIT/models.jsonl" \
            -o "$RUNNER_TEMP/models.jsonl"

      - name: Refusals before any download
        run: |
          set -u
          cargo build --release --locked -p medscale-cli
          bin=target/release/medscale
          # No consent flag: refused.
          if "$bin" packs acquire --snapshot "$RUNNER_TEMP/models.jsonl" --commit "$CATALOG_COMMIT" \
              --repo-id "${{ matrix.repo }}" --onnx-file "${{ matrix.file }}" \
              --approve-bytes "${{ matrix.approve }}" --out "$RUNNER_TEMP/denied"; then
            echo "acquisition without consent must fail"; exit 1
          fi
          # Byte ceiling below the files' exact size: refused before any file download.
          if "$bin" packs acquire --snapshot "$RUNNER_TEMP/models.jsonl" --commit "$CATALOG_COMMIT" \
              --repo-id "${{ matrix.repo }}" --onnx-file "${{ matrix.file }}" \
              --approve-bytes 1000 --i-consent-to-download --out "$RUNNER_TEMP/denied"; then
            echo "acquisition over the approved bytes must fail"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/denied"

      - name: Acquire through the product CLI (live)
        run: |
          target/release/medscale packs acquire --snapshot "$RUNNER_TEMP/models.jsonl" \
            --commit "$CATALOG_COMMIT" --repo-id "${{ matrix.repo }}" \
            --onnx-file "${{ matrix.file }}" --approve-bytes "${{ matrix.approve }}" \
            --i-consent-to-download --out "$RUNNER_TEMP/acquired" | tee acquisition.json
          ls -l "$RUNNER_TEMP/acquired"

      - name: Verify, admit and execute what was acquired
        env:
          MEDSCALE_CATALOG_SNAPSHOT: ${{ runner.temp }}/models.jsonl
          MEDSCALE_CATALOG_COMMIT: ${{ env.CATALOG_COMMIT }}
          MEDSCALE_HF_SNAPSHOT_DIR: ${{ runner.temp }}/acquired
          MEDSCALE_HF_ONNX_FILE: ${{ matrix.file }}
          MEDSCALE_SAMPLE_TEXT: "The patient has type 2 diabetes mellitus and pain in the left knee."
        run: |
          set -o pipefail
          cargo test --release --locked -p medscale-pack --test "${{ matrix.test }}" \
            -- --ignored --nocapture 2>&1 | tee qualification.log
          { echo '```json'; cat acquisition.json; echo '```'; grep -E '^SNAPSHOT_' qualification.log; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs (no weights)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: live-acquisition-${{ matrix.kind }}
          path: |
            acquisition.json
            qualification.log
          if-no-files-found: ignore
