# Test-only prototype of native WKWebView WebDriver on a free ephemeral Mac.
# The automation HTTP server is feature-gated and NOT packaged in MedScale.
name: macos-embedded-webdriver-diagnostic
on:
  push:
    branches: ["diag/macos-embedded-wdio-*"]
permissions:
  contents: read
concurrency:
  group: mac-native-webdriver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-webdriver:
    name: macOS Tauri WKWebView E2E test-only embedded WebDriver
    runs-on: macos-latest
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: mac-embedded-webdriver-ci-only
      - name: Verify test-only source instrumentation and prepare frontend
        run: |
          python3 -m py_compile scripts/ci/macos-webdriver-*.py
          python3 scripts/ci/macos-webdriver-instrument.py
          cd apps/desktop-tauri
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Build native macOS Tauri with explicit diagnostic-only feature
        working-directory: apps/desktop-tauri
        run: |
          npm run tauri -- build --bundles app --no-sign --ci --features custom-protocol,macos-webdriver-ci
      - name: Real WKWebView synthetic project and Audio journey via WebDriver
        timeout-minutes: 7
        run: |
          python3 -u scripts/ci/macos-webdriver-smoke.py
      - name: Report only proven narrow claim
        if: success()
        run: |
          echo "Real macOS bundled WKWebView synthetic workspace -> project create -> Audio controls: PASS (test-only WebDriver). No public speech corpus/model used in this journey." >> "$GITHUB_STEP_SUMMARY"
