# End-to-end user journeys against the real MedScale desktop binary.
#
# Builds the release desktop (custom protocol, bundled frontend; plus the
# test-only e2e-webdriver feature, which turns off WebView2 InPrivate so Edge
# WebDriver can attach), starts
# tauri-driver with the runner's Microsoft Edge WebDriver for WebView2, and
# runs scripts/e2e/desktop-journey.mjs: open the synthetic workspace,
# patients, projects, MedAgent (agent, run, evidence), the model catalog,
# documents, a disclosed FHIR export, the audit trail, and persistence after
# relaunching the app. Synthetic data only. Screenshots are kept as visual
# evidence.
name: desktop-e2e

on:
  push:
    branches: ["e2e/**"]
  pull_request:
    paths:
      - apps/desktop-tauri/**
      - scripts/e2e/**
      - crates/**
      - .github/workflows/desktop-e2e.yml

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: desktop e2e (windows)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: desktop-e2e
      - name: Build the frontend
        working-directory: apps/desktop-tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build the release desktop
        run: cargo build --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --features custom-protocol,e2e-webdriver --release --locked
      - name: Install tauri-driver (pinned)
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Run the journeys
        shell: pwsh
        run: |
          $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          & $driver --version
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue | ForEach-Object { "WebView2 $($_.Name)" }
          $td = Start-Process -FilePath tauri-driver -ArgumentList @('--native-driver', $driver) -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          try {
            node scripts/e2e/desktop-journey.mjs apps/desktop-tauri/src-tauri/target/release/medscale-desktop-tauri.exe target/e2e-shots
            if ($LASTEXITCODE -ne 0) { throw "journeys failed" }
          } finally {
            Stop-Process -Id $td.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-screenshots
          path: target/e2e-shots/
          if-no-files-found: warn
          retention-days: 14
