name: clinical-evidence-python

on:
  pull_request:
    paths:
      - 'integrations/clinical-evidence-python/**'
      - 'scripts/vendor_openmed_clinical.py'
      - 'scripts/vendor_openmed_clinical_v2.py'
      - 'crates/medscale-clinical/tests/vectors/**'
      - '.github/workflows/clinical-evidence-python.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/clinical-evidence-python/**'
      - 'scripts/vendor_openmed_clinical.py'
      - 'scripts/vendor_openmed_clinical_v2.py'
      - 'crates/medscale-clinical/tests/vectors/**'
      - '.github/workflows/clinical-evidence-python.yml'

permissions:
  contents: read

concurrency:
  group: clinical-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: clinical evidence (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated package and test tools
        working-directory: integrations/clinical-evidence-python
        run: python -m pip install -e ".[test]"
      - name: Run source-derived synthetic clinical tests
        working-directory: integrations/clinical-evidence-python
        run: python -m pytest tests -q
