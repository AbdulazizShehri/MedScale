# Proof of MSIX packaging only. No user download, Store submission, or publication.
# Only runs on disposable GitHub-hosted Windows runners; no owner-PC installation.
name: windows-msix-qualification

on:
  pull_request:
    paths:
      - apps/desktop-tauri/msix/**
      - scripts/package-tauri-msix.ps1
      - .github/workflows/windows-msix-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msix-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Dwarnings
  CARGO_BUILD_JOBS: '2'

jobs:
  package:
    name: Unsigned MSIX archive proof (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - name: Locked Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.97.1'
      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
      - name: Install frontend (no lifecycle scripts)
        working-directory: apps/desktop-tauri
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend for native embedding
        working-directory: apps/desktop-tauri
        run: npm run build
      - name: Build exact source native executable
        shell: pwsh
        run: cargo build --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --features custom-protocol --release --locked
      - name: Microsoft Windows App Developer CLI
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3.0 action source pin
        with:
          version: v0.3.0
      - name: Verify winapp version
        shell: pwsh
        run: winapp --version
      - name: Create and inspect UNSIGNED MSIX archive
        shell: pwsh
        run: ./scripts/package-tauri-msix.ps1 -Profile CI
      - name: Assert correct no-release status
        shell: pwsh
        run: |
          $m = Get-Content target/msix-qualification/qualification.json -Raw | ConvertFrom-Json
          if ($m.profile -ne 'CI' -or $m.signature -ne 'unsigned' -or $m.public_release -or $m.store_certified -or $m.install_qualified -or $m.end_user_installable_without_warning) {
            throw 'Unsigned development archive was misreported as approved'
          }
          $expected = (git rev-parse HEAD).Trim()
          if ($m.source_sha -ne $expected) { throw 'Source identity mismatch' }
          $msix = Join-Path target/msix-qualification $m.msix_file
          if ((Get-FileHash -LiteralPath $msix -Algorithm SHA256).Hash.ToLowerInvariant() -ne $m.msix_sha256) { throw 'MSIX integrity mismatch' }
      - name: Upload metadata only (never distribute test MSIX)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: msix-archive-qualification-metadata-not-a-release
          path: |
            target/msix-qualification/qualification.json
            target/msix-qualification/Package.appxmanifest
          if-no-files-found: error
          retention-days: 7
