# Builds a Developer ID signed, notarized and stapled DMG. Manual only, and it
# publishes nothing: the DMG is a workflow artifact. It stops if any credential is
# missing, and it never falls back to an ad-hoc signature. A run that succeeds
# qualifies signing only: that exact DMG still needs the installed journey.
#
# Needs an Apple Developer Program membership and a Developer ID Application
# certificate. Set these secrets on the `macos-signing` environment, which should
# require the founder's approval:
#   APPLE_CERTIFICATE           base64 of the exported .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple account for notarization
#   APPLE_PASSWORD              app-specific password for that account
#   APPLE_TEAM_ID               ten-character team ID
name: release-macos-signed

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-dmg:
    name: Developer ID signed and notarized DMG
    runs-on: macos-latest
    timeout-minutes: 120
    environment: macos-signing
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Refuse to run without every credential
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Nothing was built."
            exit 1
          fi
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity"; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Build only the exact commit requested
        run: |
          [ "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}" ] || { echo "::error::checkout isn't the requested commit"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
      - name: Install locked frontend without lifecycle scripts
        working-directory: apps/desktop-tauri
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Tauri reads the APPLE_* variables to import the certificate into a temporary
      # keychain, sign with the hardened runtime, then notarize and staple the app.
      - name: Build, sign and notarize the app
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles app,dmg --ci --features custom-protocol -- --locked
      - name: Notarize and staple the DMG itself
        run: |
          set -euo pipefail
          dmg="$(find apps/desktop-tauri/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f | head -1)"
          [ -n "$dmg" ] || { echo "::error::no DMG was built"; exit 1; }
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          echo "SIGNED_DMG=$dmg" >> "$GITHUB_ENV"
      - name: Ask Apple's own tools whether this passes
        run: |
          set -euo pipefail
          report=target/macos-signed/report.txt
          mkdir -p target/macos-signed
          echo "SOURCE_SHA=${{ inputs.source_sha }}" | tee -a "$report"
          echo "DMG_SHA256=$(shasum -a 256 "$SIGNED_DMG" | cut -d' ' -f1)" | tee -a "$report"
          xcrun stapler validate "$SIGNED_DMG"
          spctl --assess --type open --context context:primary-signature -vv "$SIGNED_DMG" 2>&1 | tee -a "$report"
          yes | hdiutil attach -nobrowse -readonly "$SIGNED_DMG" > target/macos-signed/attach.txt || true
          mount_point="$(awk -F'\t' '/\/Volumes\//{print $NF; exit}' target/macos-signed/attach.txt)"
          [ -n "$mount_point" ] || { echo "::error::the DMG didn't mount"; exit 1; }
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority=Developer ID|TeamIdentifier|Signature)' | tee -a "$report"
          spctl --assess --type execute -vv "$app" 2>&1 | tee -a "$report"
          xcrun stapler validate "$app"
          hdiutil detach "$mount_point" -quiet || hdiutil detach "$mount_point" -force
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: macos-signed-candidate
          path: |
            ${{ env.SIGNED_DMG }}
            target/macos-signed/report.txt
          if-no-files-found: error
          retention-days: 30
