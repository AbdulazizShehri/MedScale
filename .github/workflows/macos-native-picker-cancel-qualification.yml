# Qualifies actual macOS OS file/folder chooser dismissal, not mocked picker helpers.
# Disposable GitHub runner only. No Whisper weights, voice media or user data.
name: macos-native-picker-cancel-qualification

on:
  pull_request:
    paths:
      - scripts/ci/macos-webdriver-smoke.py
      - scripts/ci/macos-webdriver-instrument.py
      - .github/workflows/macos-native-picker-cancel-qualification.yml

permissions:
  contents: read

concurrency:
  group: macos-native-picker-cancel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-picker-cancel:
    name: macOS real file/folder picker Escape and path-preservation
    runs-on: macos-latest
    timeout-minutes: 140
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: macos-native-picker-cancel-isolated
      - name: Prepare test-only localhost WebDriver and frontend
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/macos-webdriver-instrument.py scripts/ci/macos-webdriver-smoke.py
          python3 scripts/ci/macos-webdriver-instrument.py
          cd apps/desktop-tauri
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Build unsigned ephemeral macOS native WKWebView app
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles app --no-sign --ci --features custom-protocol,macos-webdriver-ci
      - name: Observe OS native file and folder pickers and cancel using Escape
        timeout-minutes: 12
        env:
          MEDSCALE_MAC_E2E_NATIVE_PICKER_CANCEL: "1"
        run: python3 -u scripts/ci/macos-webdriver-smoke.py
      - name: Record bounded qualification scope
        if: success()
        run: |
          echo 'Native macOS picker cancellation: real AppKit file and folder dialogs, Escape, retained explicit path, recovered UI: PASS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No user data, model weights, screenshots, public builds or downloads. This does not qualify VoiceOver, arbitrary filesystem access, signing, notarization or production release.' >> "$GITHUB_STEP_SUMMARY"
