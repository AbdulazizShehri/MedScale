# True native WKWebView error-recovery test with CI-only early HTTP refusal.
# Builds an unsigned ephemeral app; NEVER requests/downstreams model weights.
name: macos-whisper-offline-failure-qualification

on:
  pull_request:
    paths:
      - scripts/ci/macos-model-offline-instrument.py
      - scripts/ci/macos-webdriver-smoke.py
      - scripts/ci/macos-webdriver-instrument.py
      - .github/workflows/macos-whisper-offline-failure-qualification.yml

permissions:
  contents: read

concurrency:
  group: macos-whisper-offline-failure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-offline:
    name: macOS native Whisper error and staging cleanup (no HTTP)
    runs-on: macos-latest
    timeout-minutes: 140
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: macos-whisper-offline-failure-isolated
      - name: Inject test-only WebDriver and zero-network fault into ephemeral checkout
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/macos-webdriver-instrument.py scripts/ci/macos-model-offline-instrument.py scripts/ci/macos-webdriver-smoke.py
          python3 scripts/ci/macos-webdriver-instrument.py
          python3 scripts/ci/macos-model-offline-instrument.py
          grep -q 'MEDSCALE_MAC_E2E_FORCE_OFFLINE' apps/desktop-tauri/src-tauri/src/audio_model_manager.rs
          cd apps/desktop-tauri
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Build unsigned disposable native desktop with no real audio model
        working-directory: apps/desktop-tauri
        run: npm run tauri -- build --bundles app --no-sign --ci --features custom-protocol,macos-webdriver-ci
      - name: Prove actual native worker offline error, staging cleanup and fresh-consent retry
        timeout-minutes: 12
        env:
          MEDSCALE_MAC_E2E_FORCE_OFFLINE: "1"
        run: python3 -u scripts/ci/macos-webdriver-smoke.py
      - name: Record narrow qualification
        if: success()
        run: |
          echo 'Production GUI -> native IPC -> actual download worker error -> owned staging cleanup -> explicit re-consent retry: PASS under CI-only early HTTP refusal.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model download, no recording, no patient data, no real network disconnect, no user-device install. Does not prove real DNS/OS outage, signed distribution, medical accuracy or VoiceOver.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove isolated native cache path proof
        if: always()
        run: rm -f "$RUNNER_TEMP/medscale-offline-cache-root.txt"
