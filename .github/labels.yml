# MedScale issue and pull request labels.
# The maintainer applies this file. Nothing here creates labels automatically.
- name: bug
  color: "d73a4a"
  description: Something does not work as it should
- name: enhancement
  color: "a2eeef"
  description: A new feature or an improvement to an existing one
- name: accessibility
  color: "5319e7"
  description: Hard or impossible to use with assistive technology or a keyboard
- name: security
  color: "b60205"
  description: Security fix or hardening; report vulnerabilities privately, not in issues
- name: windows
  color: "0078d4"
  description: Affects Windows only
- name: macos
  color: "6e7781"
  description: Affects macOS only
- name: privacy
  color: "8250df"
  description: Could expose personal data or send data off the device
- name: data-integrity
  color: "e99695"
  description: Could lose, corrupt or wrongly change user data or vault files
- name: needs-triage
  color: "fbca04"
  description: New; a maintainer has not reviewed it yet
- name: confirmed
  color: "0e8a16"
  description: A maintainer has reproduced it
- name: priority:p0
  color: "b60205"
  description: Security or data loss; fixed in an immediate patch release
- name: priority:p1
  color: "d93f0b"
  description: A core workflow is broken; fixed in the next patch release
- name: priority:p2
  color: "fef2c0"
  description: Everything else; kept in the backlog
- name: good-first-issue
  color: "7057ff"
  description: A small, well-defined task for a new contributor
- name: installation
  color: "1d76db"
  description: Install, first launch, update or uninstall
- name: release-blocker
  color: "000000"
  description: Must be fixed before the next release ships
