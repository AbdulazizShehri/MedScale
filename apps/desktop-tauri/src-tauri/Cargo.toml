[package]
name = "medscale-desktop-tauri"
version = "0.1.0"
description = "MedScale Desktop (Tauri): Rust-owned Core sessions behind named commands"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
build = "build.rs"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]
# Test-only: lets Edge WebDriver attach for desktop E2E (disables InPrivate).
# Never enabled for packaged builds.
e2e-webdriver = ["external-packs"]
# Test-only: admits model Packs from any folder. Pack signatures have no real
# trust root yet, so packaged builds only install verified downloads.
external-packs = []

[dependencies]
rusqlite = { version = "=0.37.0" }
medscale-contracts = { path = "../../../crates/medscale-contracts", version = "0.1.0" }
medscale-core = { path = "../../../crates/medscale-core", version = "0.1.0" }
medscale-pack = { path = "../../../crates/medscale-pack", version = "0.1.0" }
medscale-desktop-vm = { path = "../../../crates/medscale-desktop-vm", version = "0.1.0" }
medscale-fhir = { path = "../../../crates/medscale-fhir", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fs2 = "=0.4.3"
url = "=2.5.8"
ureq = "=3.4.2"
tauri = { version = "=2.12.0", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }
tauri-plugin-dialog = "=2.6.0"

[build-dependencies]
tauri-build = { version = "=2.7.0" }

[dev-dependencies]
medscale-pack = { path = "../../../crates/medscale-pack", version = "0.1.0", features = ["synthetic-fixtures"] }
medscale-storage = { path = "../../../crates/medscale-storage", version = "0.1.0" }
tauri = { version = "=2.12.0", default-features = false, features = ["test"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }

# The repository's pinned candle-core 0.9.1 backport to zip 9.0.3
# (vendor/candle-core-0.9.1/MEDSCALE_PATCH.md). This crate is its own
# workspace, so the root patch must be repeated here.
[patch.crates-io]
candle-core = { path = "../../../vendor/candle-core-0.9.1" }
# glib 0.18.5 with the upstream soundness fix for RUSTSEC-2024-0429
# (vendor/glib-0.18.5/MEDSCALE_PATCH.md). Linux-only: Windows and macOS
# graphs have no glib.
glib = { path = "../../../vendor/glib-0.18.5" }
