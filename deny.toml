# cargo-deny 0.20+ configuration for MedScale Spec 001.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# Each exception needs the founder's approval, a reason naming its
# mitigation, and removal as soon as a fixed release exists.
# scripts/ci/tauri_deny_config.py refuses entries without a reason.
ignore = [
    # C SQLite before 3.54 can return uninitialised memory when a database is
    # opened with a crafted `-wal` sibling. MedScale builds SQLCipher, which has
    # no fixed release (sqlcipher-src 419.0.6 bundles SQLite 3.53.4). The only
    # database MedScale opens that someone else may have written is an external
    # SQLite data source, and that open refuses a `-wal` sibling
    # (crates/medscale-storage/src/data_sources.rs, open_external_readonly).
    # Accepted by the founder on 2026-11-09. Remove when a SQLCipher release
    # bundles SQLite 3.54 or later.
    { id = "RUSTSEC-2026-0459", reason = "mitigated: external databases with a -wal sibling are refused; no fixed SQLCipher release" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "LicenseRef-Slint-Royalty-free-2.0",
]
unused-allowed-license = "allow"

exceptions = [
    { crate = "clipboard-win@5.4.3", allow = ["BSL-1.0"] },
    { crate = "error-code@3.4.0", allow = ["BSL-1.0"] },
    { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
    # Spec 096: unmodified Tauri presentation dependencies; source archives and
    # MPL notice must accompany preview artifacts (096-tauri-presentation.md).
    { crate = "cssparser@0.37.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.7.1", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "selectors@0.38.0", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
